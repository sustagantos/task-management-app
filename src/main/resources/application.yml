spring:
  application:
    name: tasks

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasks}
    username: ${DB_USER:tasks}
    password: ${DB_PASSWORD:tasks}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate must never touch it - a stray
      # ddl-auto would silently diverge from the migrations.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      # ISO-8601 strings, not epoch numbers. The browser parses these directly
      # and they are readable in a log or a curl.
      write-dates-as-timestamps: false

  security:
    oauth2:
      client:
        registration:
          # The registration id 'entra' is part of the redirect URI registered
          # in Entra: /login/oauth2/code/entra. Renaming it here breaks sign-in.
          entra:
            client-id: ${ENTRA_CLIENT_ID}
            client-secret: ${ENTRA_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            client-name: PatoBytes Entra ID
        provider:
          entra:
            issuer-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
            # MUST be a claim the UserInfo endpoint actually returns. Spring
            # resolves this against the UserInfo response, and Microsoft's
            # returns only sub, name, given_name, family_name, email and
            # picture - no oid. Setting it to oid fails every login with
            # "Attribute value for 'oid' cannot be null" before any application
            # code runs.
            #
            # oid still identifies the user, but it lives in the ID token. The
            # merged claim view on OidcUser exposes it, which is where
            # UserProvisioningService reads it from.
            user-name-attribute: sub

server:
  port: 8080
  forward-headers-strategy: framework

app:
  # Every day-boundary calculation goes through this. "Closed today" is a
  # local-day rule, so it is never derived from the browser or the JVM default.
  timezone: America/Sao_Paulo

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
